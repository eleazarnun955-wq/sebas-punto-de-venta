name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21\n        uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: "21"\n      - name: Set up Android SDK 36\n        uses: android-actions/setup-android@v3\n        with:\n          packages: platform-tools platforms;android-36 build-tools;36.0.0\n      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do\n            if ./gradlew assembleDebug; then exit 0; fi\n            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi\n          done\n          exit 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sebas-punto-de-venta-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-v1.0.0
          name: SEBAS PUNTO DE VENTA Android 1.0.0 (pruebas)
          body: APK de depuración para probar el funcionamiento en Android. No es una versión de producción firmada.
          draft: false
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
