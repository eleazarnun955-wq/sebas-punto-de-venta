name: Validate POS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check --input-type=module < src/app.js
          node --check --input-type=module < src/db.js
          node --check --input-type=module < src/backup.js
          node --check --input-type=module < src/operations.js
          node --check --input-type=module < src/barcode-scanner.js\n          node --check --input-type=module < src/neon-auth.js
      - name: Run business logic tests
        run: node --experimental-default-type=module --test

  android-debug:
    runs-on: ubuntu-latest
    needs: syntax-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK (retry transient Maven rate limits)
        working-directory: android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed (often a temporary Maven Central 429); retrying in $((attempt * 30)) seconds..."
              sleep $((attempt * 30))
            fi
          done
          exit 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sebas-punto-de-venta-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
